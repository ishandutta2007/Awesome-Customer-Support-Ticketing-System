<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow1 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.55; }
      }
      @keyframes pulseGlow2 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
        50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.5; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(-40px) translateX(-20px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .glow-orb-1 { animation: pulseGlow1 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .glow-orb-2 { animation: pulseGlow2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
      .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 8s ease-in-out infinite 1s; }
      .flow-line { stroke-dasharray: 6 8; animation: dashFlow 20s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 13px; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Lights in Background -->
  <circle cx="200" cy="120" r="160" fill="#0284c7" filter="url(#glowCyan)" class="glow-orb-1" />
  <circle cx="1020" cy="300" r="180" fill="#7c3aed" filter="url(#glowPurple)" class="glow-orb-2" />
  <circle cx="600" cy="40" r="130" fill="#4f46e5" filter="url(#glowCyan)" opacity="0.25" />

  <!-- Background Grid Mesh -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Connecting Network Curves in Background -->
  <g opacity="0.35">
    <path d="M -50 200 Q 250 80, 500 210 T 1000 180 T 1250 260" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" />
    <path d="M -50 260 Q 300 380, 650 240 T 1100 290 T 1250 150" fill="none" stroke="#a855f7" stroke-width="2" class="flow-line" style="animation-duration: 25s;" />
  </g>

  <!-- Ambient Floating Nodes / Particles -->
  <g class="particle-1">
    <circle cx="150" cy="90" r="3.5" fill="#38bdf8" />
    <circle cx="1050" cy="140" r="3" fill="#c084fc" />
    <circle cx="920" cy="80" r="2.5" fill="#38bdf8" />
  </g>
  <g class="particle-2">
    <circle cx="280" cy="340" r="3" fill="#818cf8" />
    <circle cx="820" cy="350" r="4" fill="#38bdf8" />
    <circle cx="1120" cy="240" r="3" fill="#f472b6" />
  </g>

  <!-- Dynamic Decorative Visual Elements (Right Side Dashboard Preview Card) -->
  <g transform="translate(850, 60)" filter="url(#dropShadow)" opacity="0.95">
    <!-- Mini Metric Glass Card -->
    <rect width="290" height="180" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Window controls -->
    <circle cx="22" cy="20" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="20" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="50" cy="20" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="75" y="24" fill="#94a3b8" class="badge-text" font-size="11">Omnichannel Live Queue</text>

    <!-- Ticket Items -->
    <rect x="20" y="42" width="250" height="32" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="36" cy="58" r="5" fill="#10b981" />
    <text x="52" y="62" fill="#f1f5f9" class="badge-text" font-size="11">TICKET #4829 • Priority High</text>
    <rect x="210" y="50" width="50" height="16" rx="4" fill="#0369a1" />
    <text x="221" y="62" fill="#e0f2fe" class="badge-text" font-size="9">AI Fin</text>

    <rect x="20" y="84" width="250" height="32" rx="7" fill="#0f172a" stroke="#475569" stroke-width="0.6" stroke-opacity="0.5" />
    <circle cx="36" cy="100" r="5" fill="#38bdf8" />
    <text x="52" y="104" fill="#cbd5e1" class="badge-text" font-size="11">Shared Inbox • 4 New Chats</text>
    <rect x="210" y="92" width="50" height="16" rx="4" fill="#4338ca" />
    <text x="217" y="104" fill="#e0e7ff" class="badge-text" font-size="9">Active</text>

    <rect x="20" y="126" width="250" height="32" rx="7" fill="#0f172a" stroke="#475569" stroke-width="0.6" stroke-opacity="0.5" />
    <circle cx="36" cy="142" r="5" fill="#a855f7" />
    <text x="52" y="146" fill="#cbd5e1" class="badge-text" font-size="11">SLA Resolution Rate • 99.4%</text>
    <rect x="210" y="134" width="50" height="16" rx="4" fill="#065f46" />
    <text x="223" y="146" fill="#d1fae5" class="badge-text" font-size="9">SLA</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Ensured 100% foreground clarity and high contrast) -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(70, 62)">
    <rect width="365" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" fill="#38bdf8" class="badge-text">CURATED ECOSYSTEM • SAAS &amp; OPEN-SOURCE</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="146" fill="url(#primaryGrad)" class="title-text" font-size="44" letter-spacing="-0.8">
    Customer Support Ticketing System
  </text>

  <!-- Subtitle -->
  <text x="70" y="188" fill="#f8fafc" class="subtitle-text" font-size="20" letter-spacing="0.2">
    Enterprise Helpdesks, Shared Inboxes, ITSM &amp; AI-Powered Resolution
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="70" y="224" fill="#94a3b8" class="subtitle-text" font-size="15">
    Comparing top commercial SaaS platforms with leading self-hosted open-source GitHub alternatives.
  </text>

  <!-- Feature & Architectural Pills in Foreground -->
  <g transform="translate(70, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">Omnichannel Inbox</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(182, 0)">
      <rect width="186" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#818cf8" />
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">SLA &amp; Workflow Rules</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="168" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">AI Support Agents</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(560, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#34d399" />
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">Self-Hosted / Open</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="70" y="365" width="1060" height="2" rx="1" fill="url(#primaryGrad)" opacity="0.6" />
</svg>
